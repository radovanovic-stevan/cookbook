name: Deploy to GitHub Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate recipes.json
        run: |
          node -e '
            const list = JSON.parse(require("fs").readFileSync("data/recipes.json", "utf8"));
            if (!Array.isArray(list)) throw new Error("recipes.json must be an array");
            const ids = new Set();
            list.forEach((r, i) => {
              if (!r.id || !r.title) throw new Error(`recipe #${i} needs an id and a title`);
              if (ids.has(r.id)) throw new Error(`duplicate recipe id: ${r.id}`);
              ids.add(r.id);
            });
            console.log(`recipes.json OK: ${list.length} recipes`);
          '

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html .nojekyll css js data _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    # Publish only from the repository's default branch.
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
