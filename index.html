<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Family Cookbook</title>
  <meta name="description" content="A flip-through cookbook with recipes you can add, edit, filter and delete.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Playfair+Display:ital,wght@0,600;0,800;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">📖</span>
      <span class="brand-name" data-i18n="app.title">Family Cookbook</span>
    </div>

    <div class="search">
      <input id="search" type="search" data-i18n-placeholder="search.placeholder" data-i18n-aria="search.placeholder" autocomplete="off">
    </div>

    <div class="actions">
      <div class="seg lang-switch" role="radiogroup" data-i18n-aria="lang.label">
        <button type="button" data-lang="en" role="radio" title="English">EN</button>
        <button type="button" data-lang="sr" role="radio" title="Srpski">SR</button>
      </div>
      <button id="toggleFilters" class="btn" aria-expanded="false" aria-controls="filters">
        <span data-i18n="filters.button">Filters</span> <span id="filterCount" class="badge" hidden>0</span>
      </button>
      <button id="newRecipe" class="btn btn-primary" data-i18n="newRecipe">+ New recipe</button>
      <div class="menu">
        <button id="dataMenuBtn" class="btn" aria-haspopup="true" aria-expanded="false">
          <span data-i18n="data.button">Data</span> <span id="syncDot" class="dot"></span>
        </button>
        <div id="dataMenu" class="menu-list" role="menu" hidden>
          <p id="syncStatus" class="menu-status"></p>
          <button role="menuitem" data-action="export" data-i18n="menu.export"></button>
          <button role="menuitem" data-action="import" data-i18n="menu.import"></button>
          <button role="menuitem" data-action="github" data-i18n="menu.github"></button>
          <hr>
          <button role="menuitem" data-action="reset" data-i18n="menu.reset"></button>
        </div>
      </div>
      <input id="importFile" type="file" accept="application/json,.json" hidden>
    </div>
  </header>

  <section id="filters" class="filters" hidden>
    <div class="filter-group filter-ingredients">
      <div class="filter-head">
        <h3 data-i18n="f.ingredients"></h3>
        <div class="seg" id="ingredientMode" role="radiogroup">
          <button type="button" data-mode="all" class="active" role="radio" aria-checked="true" data-i18n="f.hasAll"></button>
          <button type="button" data-mode="any" role="radio" aria-checked="false" data-i18n="f.hasAny"></button>
        </div>
        <input id="ingredientSearch" type="search" data-i18n-placeholder="f.findIngredient" data-i18n-aria="f.findIngredient">
      </div>
      <div id="ingredientChips" class="chips"></div>
    </div>
    <div class="filter-row">
      <div class="filter-group">
        <h3 data-i18n="f.preparation"></h3>
        <div id="preparationChips" class="chips"></div>
      </div>
      <div class="filter-group">
        <h3 data-i18n="f.course"></h3>
        <div id="categoryChips" class="chips"></div>
      </div>
      <div class="filter-group">
        <h3 data-i18n="f.cuisine"></h3>
        <div id="cuisineChips" class="chips"></div>
      </div>
      <div class="filter-group">
        <h3 data-i18n="f.difficulty"></h3>
        <div id="difficultyChips" class="chips"></div>
      </div>
      <div class="filter-group">
        <h3 data-i18n="f.time"></h3>
        <label class="range">
          <input id="maxTime" type="range" min="0" max="240" step="5" value="240" data-i18n-aria="f.time">
          <span id="maxTimeLabel"></span>
        </label>
      </div>
    </div>
    <div class="filter-foot">
      <span id="resultCount"></span>
      <button id="clearFilters" class="btn btn-link" type="button" data-i18n="f.clear"></button>
    </div>
  </section>

  <main class="stage">
    <button id="prevBtn" class="nav nav-prev" data-i18n-aria="nav.prev">‹</button>
    <div id="book" class="book" aria-live="polite">
      <div id="pages" class="pages"></div>
    </div>
    <button id="nextBtn" class="nav nav-next" data-i18n-aria="nav.next">›</button>
  </main>
  <p class="hint" data-i18n="hint"></p>

  <!-- Create / edit recipe -->
  <dialog id="recipeDialog" class="dialog">
    <form id="recipeForm" method="dialog" novalidate>
      <header class="dialog-head">
        <h2 id="recipeDialogTitle"></h2>
        <div class="form-lang">
          <span data-i18n="form.lang"></span>
          <div class="seg seg-light" id="formLang" role="radiogroup">
            <button type="button" data-form-lang="en" role="radio">English</button>
            <button type="button" data-form-lang="sr" role="radio">Srpski</button>
          </div>
        </div>
        <button type="button" class="icon-btn" data-close data-i18n-aria="form.close">✕</button>
      </header>
      <div class="dialog-body">
        <p class="form-hint" data-i18n="form.langHint"></p>
        <div class="grid">
          <label class="span-3"><span data-i18n="form.title"></span>
            <input name="title" data-text maxlength="80" data-i18n-placeholder="ph.title">
          </label>
          <label><span data-i18n="form.emoji"></span>
            <input name="emoji" maxlength="4" placeholder="🍰">
          </label>
          <label class="span-4"><span data-i18n="form.description"></span>
            <textarea name="description" data-text rows="2" maxlength="240" data-i18n-placeholder="ph.description"></textarea>
          </label>
          <label class="span-2"><span data-i18n="f.preparation"></span>
            <input name="preparation" data-text list="dl-preparation" data-i18n-placeholder="ph.preparation">
          </label>
          <label class="span-2"><span data-i18n="f.course"></span>
            <input name="category" data-text list="dl-category" data-i18n-placeholder="ph.category">
          </label>
          <label class="span-2"><span data-i18n="f.cuisine"></span>
            <input name="cuisine" data-text list="dl-cuisine" data-i18n-placeholder="ph.cuisine">
          </label>
          <label class="span-2"><span data-i18n="f.difficulty"></span>
            <select name="difficulty">
              <option value="Easy" data-i18n="difficulty.Easy"></option>
              <option value="Medium" data-i18n="difficulty.Medium"></option>
              <option value="Hard" data-i18n="difficulty.Hard"></option>
            </select>
          </label>
          <label><span data-i18n="form.prepMin"></span>
            <input name="prepTime" type="number" min="0" step="1" value="0">
          </label>
          <label><span data-i18n="form.cookMin"></span>
            <input name="cookTime" type="number" min="0" step="1" value="0">
          </label>
          <label><span data-i18n="form.servings"></span>
            <input name="servings" type="number" min="1" step="1" value="4">
          </label>
          <label><span data-i18n="form.image"></span>
            <input name="image" type="url" data-i18n-placeholder="ph.optional">
          </label>
        </div>

        <fieldset>
          <legend data-i18n="f.ingredients"></legend>
          <div id="ingredientRows" class="rows"></div>
          <button type="button" class="btn btn-small" id="addIngredient" data-i18n="form.addIngredient"></button>
        </fieldset>

        <fieldset>
          <legend data-i18n="r.method"></legend>
          <div id="stepRows" class="rows"></div>
          <button type="button" class="btn btn-small" id="addStep" data-i18n="form.addStep"></button>
        </fieldset>

        <label><span><span data-i18n="form.tags"></span> <small data-i18n="form.tagsHint"></small></span>
          <input name="tags" data-i18n-placeholder="ph.tags">
        </label>
        <p id="formError" class="form-error" role="alert"></p>
      </div>
      <footer class="dialog-foot">
        <button type="button" class="btn" data-close data-i18n="form.cancel"></button>
        <button type="submit" class="btn btn-primary" data-i18n="form.save"></button>
      </footer>
    </form>
  </dialog>

  <!-- GitHub sync -->
  <dialog id="githubDialog" class="dialog dialog-narrow">
    <form id="githubForm" method="dialog">
      <header class="dialog-head">
        <h2 data-i18n="gh.title"></h2>
        <button type="button" class="icon-btn" data-close data-i18n-aria="form.close">✕</button>
      </header>
      <div class="dialog-body">
        <p class="muted" data-i18n-html="gh.intro"></p>
        <div class="grid">
          <label class="span-2"><span data-i18n="gh.owner"></span><input name="owner" required></label>
          <label class="span-2"><span data-i18n="gh.repo"></span><input name="repo" required></label>
          <label class="span-2"><span data-i18n="gh.branch"></span><input name="branch" data-i18n-placeholder="gh.branchPh"></label>
          <label class="span-2"><span data-i18n="gh.path"></span><input name="path" required value="data/recipes.json"></label>
          <label class="span-4"><span data-i18n="gh.token"></span><input name="token" type="password" required autocomplete="off"></label>
          <label class="span-4 check"><input name="remember" type="checkbox"> <span data-i18n="gh.remember"></span></label>
        </div>
        <p id="githubError" class="form-error" role="alert"></p>
      </div>
      <footer class="dialog-foot">
        <button type="button" class="btn" data-close data-i18n="form.cancel"></button>
        <button type="submit" class="btn btn-primary" id="githubSubmit" data-i18n="gh.submit"></button>
      </footer>
    </form>
  </dialog>

  <datalist id="dl-preparation"></datalist>
  <datalist id="dl-category"></datalist>
  <datalist id="dl-cuisine"></datalist>
  <datalist id="dl-ingredients"></datalist>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
